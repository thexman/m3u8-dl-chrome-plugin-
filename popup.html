<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>M3U8 Downloader</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      width: 500px;
      margin: 0;
      padding: 12px;
      background: #1e1e1e;
      color: #eee;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 14px;
      margin: 0;
      flex: 1;
    }
    button {
      background: #333;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #444; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 440px;
      overflow-y: auto;
      scrollbar-gutter: stable;
    }
    li {
      border-bottom: 1px solid #333;
      padding: 8px 6px 8px 0;
      font-size: 11px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    li.empty {
      color: #888;
      font-size: 12px;
      justify-content: center;
      padding: 16px 0;
      border: none;
    }

    .icon-btn {
      flex-shrink: 0;
      width: 28px;
      height: 26px;
      padding: 0;
      font-size: 13px;
    }
    .run-btn { background: #1a4a2e; border-color: #1ab788; color: #1ab788; }
    .run-btn:hover { background: #1f6040; }
    .stop-btn { background: #3a1a1a; border-color: #e06c75; color: #e06c75; }
    .stop-btn:hover { background: #4a1a1a; }
    .remove-btn {
      background: transparent;
      border-color: transparent;
      color: #666;
      width: 22px;
    }
    .remove-btn:hover { background: #333; color: #e06c75; }

    .entry-info { flex: 1; min-width: 0; }
    .title {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #e0c97a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .source {
      display: block;
      color: #6cb6ff;
      font-size: 10px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: copy;
    }
    .source:hover { text-decoration: underline; }
    .date { color: #666; font-size: 10px; display: block; margin-top: 1px; }

    .progress {
      height: 6px;
      background: #2a2a2a;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
      position: relative;
    }
    .progress[hidden] { display: none; }
    .progress-fill {
      height: 100%;
      width: 0;
      background: #1ab788;
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .progress.merging .progress-fill { background: #c678dd; }
    .progress.done .progress-fill { background: #3a7bd5; }
    .progress.error .progress-fill { background: #e06c75; }
    .progress.indeterminate .progress-fill {
      width: 30% !important;
      position: absolute;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0% { left: -30%; }
      100% { left: 100%; }
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 3px;
      min-height: 13px;
      font-size: 10px;
    }
    .status { color: #aaa; overflow: hidden; text-overflow: ellipsis; }
    .status.ok { color: #1ab788; }
    .status.err { color: #e06c75; white-space: normal; word-break: break-word; }
    .stats { color: #888; white-space: nowrap; }

    .result { display: flex; gap: 6px; margin-top: 4px; }
    .result:empty { display: none; }
    .result button {
      font-size: 10px;
      padding: 2px 8px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-btn { background: #1a3a1a; border-color: #1ab788; color: #1ab788; min-width: 0; }
    .file-btn:hover { background: #1f4a2a; }
    .folder-btn { background: #2a2a1a; border-color: #b8a000; color: #e0c97a; flex-shrink: 0; }
    .folder-btn:hover { background: #3a3a1a; }
    .log-btn { background: #2a1a1a; border-color: #7a3a3a; color: #e06c75; flex-shrink: 0; }
  </style>
</head>
<body>
  <header>
    <h1>M3U8 playlists</h1>
    <button id="clearAll" title="Remove all entries that are not downloading">Clear</button>
    <button id="openSettings" title="Settings">⚙ Settings</button>
  </header>
  <ul id="list"></ul>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
